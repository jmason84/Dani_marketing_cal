research:
  summary: >
    GitHub search (Oct 2026) found no ready-made integrated marketing calendar in Excel
    with annual/monthly/practice views. Closest matches are Excel-generation libraries and
    a Gantt generator, which we reuse as tooling/reference rather than as a base.
  candidates:
    - { repo: jmcnamara/XlsxWriter, stars: 3986, verdict: "SELECTED build engine - tables, data validation, conditional formats, formulas, named ranges, all in pure .xlsx" }
    - { repo: trondegil/xlsx-gantt, stars: 3, verdict: "Reference only - Python/openpyxl Gantt generator with themes; not a 3-view planner. Could not read source from this session (repo not in scope) so licence/code unreviewed" }
    - { repo: BiancaLeRoux/QuiverTask, stars: 0, verdict: "Rejected - Electron/web app syncing to Excel; violates Excel-only constraint" }
    - { repo: botenvouwer/gantty, stars: 0, verdict: "Rejected - simple Gantt template, no views/counts" }
  tooling_choice:
    build: "Python 3 + XlsxWriter (generates the workbook from this YAML)"
    verify: "openpyxl (inspect) + LibreOffice headless (recalculate, screenshot to PDF/PNG)"
    rejected: ["VBA/macros (approval risk)", "Power Query/Power Pivot (not portable)", "web app (not allowed)", "Google Sheets (not allowed)"]

open_questions:
  - Which Excel version does the approving org / recipients run (TEXTJOIN needs 2019+)?
  - 'Do "events" need their own flag/count separate from other activity types? (assumed - Activity type = Event)'

decisions:                     # answered by Jordan
  - Practices are not known up front; workbook must let users add (and rename/remove) practices themselves
  - Calendar year (Jan-Dec), not fiscal
  - Multi-month activities count in every month they touch (span rule)
  - Use the slide's colour palette (navy / blue / teal)
  - Several people will edit the file

multi_editor:
  implications:
    - Host on SharePoint/OneDrive so Excel co-authoring works (macro-free .xlsx supports it)
    - Only Activity Planner and Lists are meant to be edited; view sheets are locked (no password) so formulas cannot be overwritten by accident
    - Planner has Owner, Last updated (typed) and Status columns; Start Here has a short edit etiquette (one row per activity, never delete rows mid-year, use Status=Cancelled)
    - Data validation stops bad dates and unknown practices; Check column flags problems for whoever sees it first
    - Version history relies on SharePoint/OneDrive; also add a Change Log sheet (manual, date/person/what)
